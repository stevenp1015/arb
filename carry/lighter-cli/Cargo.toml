[package]
name = "lighter-cli"
version = "0.1.0"
edition = "2021"

# NOTE: path is BOX-relative. Built only on the Tokyo box where the SDK lives at
# /root/arb/lighter/lighter-sdk and this crate at /root/carry/lighter-cli.
[dependencies]
lighter-sdk = { path = "../../arb/lighter/lighter-sdk" }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
rust_decimal = { version = "1.33", features = ["maths"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
dotenv = "0.15"

[[bin]]
name = "lighter-cli"
path = "src/main.rs"
