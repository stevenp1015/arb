  // ----------------------------------------------------------- desk channel
  // This page is embedded in the desk shell, which owns the order ticket and
  // the positions table. It is served cross-origin from there on purpose —
  // keeping it on its own host means stars, notes, targets, column layouts
  // and the global mark stay the single set he has been accumulating, instead
  // of being orphaned behind a new origin. The price of that is that the two
  // pages cannot touch each other, so they talk here instead.
  //
  // Opened on its own at :8777 there is no parent, and every one of these
  // falls back to what it always did.
  const EMBEDDED = window.parent && window.parent !== window;

  function toDesk(type, sym) {
    if (!EMBEDDED) return false;
    const i = IDX_BY_SYM[sym];
    const m = (i === undefined) ? null : META[i];
    if (!m) return false;
    const r = (i === undefined) ? null : R[i];
    try {
      window.parent.postMessage({
        source: "screener", type: type,
        sym: m.s, base: m.b, gate: m.g || "", venues: m.v,
        last: r ? r.last : null,
      }, "*");
      return true;
    } catch (e) { return false; }
  }

  // ------------------------------------------------- hold-to-scroll-the-page
  //
  // The desk lets you hold CMD or SHIFT to make its panes transparent to the
  // wheel, so the whole page scrolls instead of whichever pane happens to be
  // under the cursor. It does that by watching for key events on ITS window.
  //
  // This page is a cross-origin iframe. The moment you click a row in here —
  // which is the main thing you do in here — keyboard focus moves into this
  // document, and from then on the desk's window receives no key events at
  // all. Nothing is broken on its side; the events are simply not its to see.
  // That is why the feature worked "sometimes" and why it seemed to depend on
  // where the cursor had been.
  //
  // So this page reports the modifier state upward. Edge-triggered, because a
  // postMessage per mousemove at 60Hz across an origin boundary is not free on
  // the machine this runs on.
  let MODS_DOWN = false;

  function tellMods(down) {
    if (!EMBEDDED || down === MODS_DOWN) return;
    MODS_DOWN = down;
    try {
      window.parent.postMessage({ source: "screener", type: "mods", down }, "*");
    } catch (e) { /* the desk is gone; nothing to tell */ }
  }

  if (EMBEDDED) {
    const readMods = (e) => tellMods(!!(e.metaKey || e.shiftKey));
    window.addEventListener("keydown", readMods, true);
    window.addEventListener("keyup", readMods, true);
    window.addEventListener("mousemove", readMods, true);
    window.addEventListener("wheel", readMods, { capture: true, passive: true });
    // CMD+Tab with the key still down never delivers a keyup here either, and
    // a stuck "down" would leave the desk's panes permanently unscrollable.
    window.addEventListener("blur", () => tellMods(false));
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) tellMods(false);
    });
  }

  // Clicking a row anywhere that is not already interactive hands the pair to
  // the ticket. Nothing is placed by this — it only fills the form in — so a
  // stray click costs nothing.
  document.addEventListener("click", (e) => {
    if (!EMBEDDED) return;
    if (e.target.closest("a, .st, .note, th, button, select, input")) return;
    const tr = e.target.closest("#panes tbody tr");
    if (!tr) return;
    const a = tr.querySelector("td.sym a");
    if (!a) return;
    const mark = a.href.indexOf("BINANCE%3A");
    if (mark === -1) return;
    const sym = decodeURIComponent(a.href.slice(mark + 10)).replace(/\.P$/, "");
    toDesk("pick", sym);
  });

  // ----------------------------------------------------------- add picker
  // The old box was a bare input with a datalist, which only helped if you
  // already knew the answer. This is the same type-arrow-enter interaction as
  // the order ticket, and it gives each row two separate actions.
  const WPICK_MAX = 60;
  let wpIdx = -1;

  function wpMatches() {
    const q = $("wadd").value.trim().toUpperCase().replace("/", "_");
    if (!q) {
      // No query: lead with the busiest pairs. The whole universe has to be
      // ranked before the cut — slicing first and sorting the slice just
      // reorders the top of the alphabet, which is not a useful list.
      const all = META.filter(Boolean).slice();
      all.sort((a, b) => {
        const ra = R[a.i], rb = R[b.i];
        return ((rb && rb.q24) || 0) - ((ra && ra.q24) || 0);
      });
      return all.slice(0, WPICK_MAX);
    }
    const starts = [], contains = [];
    for (const m of META) {
      if (!m) continue;
      if (m.b.startsWith(q) || m.s.startsWith(q)) starts.push(m);
      else if (m.b.includes(q) || m.s.includes(q)) contains.push(m);
      if (starts.length >= WPICK_MAX) break;
    }
    return starts.concat(contains).slice(0, WPICK_MAX);
  }

  function renderWPick() {
    const list = $("wlist");
    const rows = wpMatches();
    const onList = new Set(store.watch.items.map(it => it.s));
    let h = EMBEDDED
      ? '<div class="hint"></div>'
      : '<div class="hint"></div>';
    if (!rows.length) {
      h += '<div class="hint">nothing matches that</div>';
    } else {
      h += rows.map((m, k) => {
        const r = R[m.i];
        const v = r ? r.d1 : null;
        const inList = onList.has(m.s);
        return '<div class="wp' + (k === wpIdx ? " active" : "") + '" data-s="' + m.s + '">'
          + '<span class="n">' + m.b + '</span>'
          + '<span class="v">' + m.s + (m.g ? "" : " &middot; aster only") + '</span>'
          + '<span class="p">' + (r && r.last ? fmtPx(r.last, m.p) : "") + '</span>'
          + '<span class="c" style="' + pctColor(v, 12) + '">' + fmtPct(v) + '</span>'
          + '<button class="plus' + (inList ? " in" : "") + '" data-add="' + m.s + '" title="'
          + (inList ? "already on the watchlist" : "add to the watchlist") + '">'
          + (inList ? "&check;" : "+") + '</button>'
          + '</div>';
      }).join("");
    }
    list.innerHTML = h;
    list.classList.add("open");
  }

  function closeWPick() { $("wlist").classList.remove("open"); wpIdx = -1; }

  // a name that matches nothing stays in the box, so a typo is fixable,
  // but it has to say so or it just looks broken
  function tryAdd(sym) {
    const el = $("wadd");
    const val = sym || el.value;
    if (!String(val).trim()) return;
    if (watchAdd(val)) {
      el.value = "";
      el.classList.remove("reject");
      closeWPick();
      return;
    }
    el.classList.remove("reject");
    void el.offsetWidth;
    el.classList.add("reject");
  }

  $("wlist").addEventListener("mousedown", (e) => {
    // mousedown, not click: the input's blur would tear the list down first
    e.preventDefault();
    const plus = e.target.closest("button[data-add]");
    if (plus) {
      // stay open so several can be added in a row
      watchAdd(plus.dataset.add);
      renderWPick();
      return;
    }
    const row = e.target.closest(".wp[data-s]");
    if (!row) return;
    const sym = row.dataset.s;
    if (EMBEDDED) {
      if (toDesk("trade", sym)) { closeWPick(); $("wadd").value = ""; return; }
    }
    // standalone, or the shell did not recognise it: the old behaviour
    window.open("https://www.tradingview.com/chart/?symbol=BINANCE:" + sym + ".P", "_blank");
    closeWPick();
  });

  $("wadd").oninput = () => { $("wadd").classList.remove("reject"); wpIdx = -1; renderWPick(); };
  $("wadd").onfocus = renderWPick;
  $("wadd").onblur = () => setTimeout(closeWPick, 130);
  $("wadd").onkeydown = (e) => {
    const open = $("wlist").classList.contains("open");
    if (e.key === "Escape") { closeWPick(); return; }
    if (!open) { if (e.key === "ArrowDown") { renderWPick(); e.preventDefault(); } return; }
    const rows = $("wlist").querySelectorAll(".wp[data-s]");
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (!rows.length) return;
      wpIdx += (e.key === "ArrowDown" ? 1 : -1);
      if (wpIdx < 0) wpIdx = rows.length - 1;
      if (wpIdx >= rows.length) wpIdx = 0;
      renderWPick();
      const a = $("wlist").querySelector(".wp.active");
      if (a) a.scrollIntoView({ block: "nearest" });
    } else if (e.key === "Enter") {
      // Enter adds, which is the muscle memory this box already had. Trading
      // is always a deliberate click on the name.
      e.preventDefault();
      const target = rows[wpIdx >= 0 ? wpIdx : 0];
      tryAdd(target ? target.dataset.s : $("wadd").value);
    }
  };

  $("wstars").onclick = () => {
    for (const sym of Object.keys(store.stars)) if (store.stars[sym]) watchAdd(sym);
  };
  applyWatch();

  // ---------------------------------------------------------------- clocks
  setInterval(() => {
    const now = new Date();
    const nxt = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + 1);
    let s = Math.max(0, Math.floor((nxt - now.getTime()) / 1000));
    const h = String(Math.floor(s / 3600)).padStart(2, "0");
    const m = String(Math.floor(s % 3600 / 60)).padStart(2, "0");
    const ss = String(s % 60).padStart(2, "0");
    $("reset").textContent = h + ":" + m + ":" + ss;
    $("markage").textContent = markAge();
  }, 1000);

  // ---------------------------------------------------------------- socket
  let ws = null, redrawSpark = false;
  function connect() {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    ws = new WebSocket(proto + "//" + location.host + "/ws");
    ws.onopen = () => { $("dot").className = "dot live"; $("conn").textContent = "live"; };
    ws.onclose = () => {
      $("dot").className = "dot dead"; $("conn").textContent = "reconnecting";
      setTimeout(connect, 1500);
    };
    ws.onerror = () => { try { ws.close(); } catch (e) { } };
    ws.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      if (msg.t === "snap") {
        META = [];
        IDX_BY_SYM = {};
        for (const s of msg.syms) {
          META[s.i] = s;
          IDX_BY_SYM[s.s] = s.i;
        }
        renderWatch();
        R.length = 0;
        for (const p of PANES) { p.trs.clear(); p.tb.innerHTML = ""; p.order = []; }
        $("npairs").textContent = msg.syms.length;
        const sk = msg.skipped || {};
        $("skipped").textContent =
          "+" + (sk.gate_only || 0) + " Gate-only and " + (sk.aster_only || 0) +
          " Aster-only pairs have no Binance feed (stock perps, venue natives) - excluded";
      } else if (msg.t === "upd") {
        const cols = ["i", "last", "m1", "m5", "m15", "h1", "h4", "d1", "d7", "q24", "vph", "rvol", "spk", "dhi", "dlo", "pos", "age",
          "sph1", "sph6", "rspk", "mprint", "big1h", "flow",
          "off7lo", "loage", "off7hi"];
        for (const d of msg.d) {
          const i = d[0];
          let r = R[i];
          if (!r) { r = R[i] = { i }; }
          for (let k = 1; k < cols.length; k++) r[cols[k]] = d[k];
          derive(r, META[i]);
          checkAlert(i, r);
        }
      } else if (msg.t === "spark") {
        SPARK = msg.d; redrawSpark = true;
      } else if (msg.t === "status") {
        $("anch").textContent = (msg.anchor_age === null || msg.anchor_age === undefined)
          ? "loading" : msg.anchor_age + "s";
        let label = "binance down";
        if (msg.ws) label = msg.src === "ws" ? "live · futures ws" : "live · futures rest " + (msg.lat || 0) + "ms";
        $("conn").textContent = label;
        $("conn").title = msg.src === "ws"
          ? "streaming !miniTicker@arr from fstream.binance.com"
          : "fstream.binance.com's ticker streams are dead from the Tokyo box (handshake, then silence), "
          + "so prices come from /fapi/v1/ticker/price polled twice a second. Measured head to head, "
          + "the websocket sees 6.4x more ticks and changes no column on this page. "
          + "It is retried in the background and takes over if it ever unblocks.";
        $("dot").className = "dot " + (msg.ws ? "live" : "dead");
        const tp = $("tape");
        if (msg.tape) {
          tp.textContent = fmtUsd(msg.tape_msgs || 0) + " trades";
          tp.style.color = "";
        } else {
          tp.textContent = "down";
          tp.style.color = "var(--dn)";
        }
      }
    };
  }
  connect();

  // ---------------------------------------------------------------- loops
  function forceDrawSparks() {
    for (const p of PANES) {
      if (!p.visible()) continue;
      for (const i of p.order) {
        const rec = p.trs.get(i);
        if (rec && rec.cells._cv) drawSpark(rec.cells._cv, SPARK[i], R[i] ? (R[i].h1 || 0) : 0);
      }
    }
  }

  setInterval(() => { renderAll(false); paintWatch(); }, 400);
  // the mark's high/low water marks only change on the minute
  setInterval(() => { loadExtremes(true).then(recompute); }, 30000);
  setInterval(renderCampLog, 30000);
  loadExtremes(true);
  // periodic re-filter, but never fight the freeze button
  setInterval(() => { if (!frozen) renderAll(true); }, 2500);
  setInterval(() => {
    if (!redrawSpark) return;
    redrawSpark = false;
    forceDrawSparks();
  }, 1000);
</script>
</body>

</html>
